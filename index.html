<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Consultoria de Treino</title>
</head>
<body>
    <!-- HEADER -->
    <header>
        <nav class="navbar">
            <img 
                src="src/images/logo_fk_v2.png" 
                alt="Logo Consultoria"
                class="logo"
            >

            <button class="btn btn-mobile">
                <i class="fa-solid fa-bars"></i>
            </button>

            <ul id="nav-links">
                <li>
                    <a href="#home">Home</a>
                </li>
                <li>
                    <a href="#sobre">Sobre</a>
                </li>
                <li>
                    <a href="#servicos">Serviços</a>
                </li>
                <li>
                    <a href="#resultados">Resultados</a>
                </li>
                <li>
                    <a href="#planoseprecos">Planos e Preços</a>
                </li>
            </ul>
            <a href="#" class="btn btn-default">
                Contatar
                <i class="bi bi-telephone"></i>
            </a>
        </nav>
    </header>
    
    <!-- MAIN -->
    <main id="container">
        <!-- HOME-->
         <section id="home">
            <img 
                src="src/images/detail.png" 
                alt="Detalhe do treino"
                class="home-image"
            >
            <h1 class="home-title">
                Resultados reais. <span> Treino sob medida.</span> 
            </h1>  
            <p class="home-description">
                Treino feito para você. Protocolo individualizado, acompanhamento próximo e resultados que aparecem.
            </p>

            <div class="home-actions">
                <a href="#" class="btn btn-default">
                    Ver planos
                </a>
                <a href="#" class="btn btn-outlined">
                    Contatar
                </a>
            </div>
         </section>
    </main>

    <script src="src/js/script.js"></script>
</body>
</html>
